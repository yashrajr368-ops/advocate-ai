{% extends "base.html" %}

{% block title %}Sign In - Adv. Mukesh Singh Rathod Chambers{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="legal-card shadow-lg border-0 p-4 p-sm-5">
                <div class="text-center mb-4">
                    <div class="stat-icon bg-warning bg-opacity-15 text-warning mx-auto mb-3 border border-warning border-opacity-25">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Welcome Back</h3>
                    <p class="text-muted small">Sign in to Advocate Mukesh Singh Rathod Legal Portal</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-body-tertiary border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" id="loginEmail" name="email" class="form-control border-start-0" placeholder="advocate@example.com" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label small fw-semibold mb-0">Password</label>
                            <a href="{{ url_for('profile') }}" class="small text-decoration-none text-muted">Forgot?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-body-tertiary border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" id="loginPassword" name="password" class="form-control border-start-0" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary-custom py-2 fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Account
                        </button>
                    </div>
                </form>

                <!-- Demo Account Quick Select -->
                <div class="p-3 bg-body-tertiary rounded-3 mt-3 border border-secondary border-opacity-10">
                    <span class="small fw-bold text-muted d-block mb-2"><i class="bi bi-lightning-fill text-warning me-1"></i> Quick Demo Login:</span>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" onclick="fillLogin('advocate@example.com', 'password123')" class="btn btn-sm btn-outline-warning">Advocate Demo</button>
                        <button type="button" onclick="fillLogin('client@example.com', 'password123')" class="btn btn-sm btn-outline-info">Client Demo</button>
                        <button type="button" onclick="fillLogin('admin@example.com', 'password123')" class="btn btn-sm btn-outline-danger">Admin Demo</button>
                    </div>
                </div>

                <div class="text-center mt-4 pt-3 border-top small text-muted">
                    Don't have an account yet? 
                    <a href="{{ url_for('register') }}" class="text-primary fw-bold text-decoration-none">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillLogin(email, pass) {
    document.getElementById('loginEmail').value = email;
    document.getElementById('loginPassword').value = pass;
}
</script>
{% endblock %}
